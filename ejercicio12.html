<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor MXN a USD</title>
  <link rel="stylesheet" href="css/ejercicio11.css">
</head>
<body>

  <div class="contenedor">
    <h1>Conversor MXN a USD</h1>
    
    <div class="form-group">
      <label for="mxn">Cantidad en pesos:</label>
      <input type="number" id="mxn" placeholder="Ej. 500" min="0" step="any">
    </div>

    <button onclick="convertir()">Convertir</button>

    <div class="form-group">
      <label for="usd">Resultado en dólares:</label>
      <input type="text" id="usd" readonly>
    </div>
  </div>

  <script src="js/ejercicio12.js"></script>
</body>
</html>
