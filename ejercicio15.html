<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 - Estudiantes</title>

    <link rel="stylesheet" href="css/ejercicio11.css">
</head>

<body>

    <div class="contenedor">

        <h1>Registro de estudiantes</h1>

        <label for="nombre">Nombre del estudiante:</label>
        <input type="text" id="nombre" placeholder="Ingresa el nombre">

        <label for="calificacion">Calificación:</label>
        <input type="text" id="calificacion" placeholder="Ingresa la calificación">

        <button onclick="agregarEstudiante()">Agregar estudiante</button>

        <h2>Estudiantes</h2>

        <div id="lista"></div>

        <button onclick="calcular()">Calcular</button>

        <label for="promedio">Calificación promedio:</label>
        <input type="text" id="promedio" readonly>

        <label for="mayor">Calificación más alta:</label>
        <input type="text" id="mayor" readonly>

        <label for="menor">Calificación más baja:</label>
        <input type="text" id="menor" readonly>

    </div>

    <script src="js/ejercicio15.js"></script>

</body>
</html>
