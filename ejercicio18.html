<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18 - Manipulación del DOM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/ejercicio18.css">
</head>

<body class="bg-light">

    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4 text-primary fs-3 fw-bold">Agregar y Eliminar Elementos</h2>
                <div class="input-group mb-3">
                    <input type="text" id="nuevoElemento" class="form-control" placeholder="Escribe algo..."
                        aria-label="Nuevo elemento">
                    <button id="agregarBtn" class="btn btn-primary" type="button">Agregar</button>
                </div>

                <ul id="lista" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script src="js/ejercicio18.js"></script>
</body>
</html>
